[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-remote-yam"
version = "0.4.0"
description = "MEMO correction learning and generalized skills on the public Remote YAM API"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.16", "pillow==12.1.1", "opencv-python-headless>=4.10", "mujoco==3.12.0", "websocket-client==1.9.0", "uvicorn==0.52.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
memo = ["sentence-transformers>=3,<6"]

[project.scripts]
memo-remote-yam = "agp_remote_yam.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agp_remote_yam = ["assets/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
